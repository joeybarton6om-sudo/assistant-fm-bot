name: Assistant FM - Bot d'accueil

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: assistant-fm-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run welcome bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WELCOME_CHANNEL: ${{ vars.WELCOME_CHANNEL || '👋 présentations' }}
        run: |
          timeout 21000 python bot_assistant_fm.py || true